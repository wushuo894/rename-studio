name: Build desktop packages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Read application version
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Read version from Tauri configuration
        id: version
        shell: bash
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          echo "version=v$version" >> $GITHUB_ENV

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-14
            rust_target: aarch64-apple-darwin
            upload_path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux x64
            platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            upload_path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
          - name: Windows x64
            platform: windows-2022
            rust_target: x86_64-pc-windows-msvc
            upload_path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri packages
        run: pnpm tauri build --target ${{ matrix.rust_target }}

      - name: Upload build packages
        uses: actions/upload-artifact@v7
        with:
          name: rename-studio-${{ matrix.rust_target }}
          path: ${{ matrix.upload_path }}
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - prepare
      - build
    runs-on: ubuntu-22.04
    steps:
      - name: Download build packages
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.version }}
          body_path: UPDATE.md
          tag_name: ${{ env.version }}
          append_body: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ./artifacts/*
