name: Build desktop packages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # 缺少签名私钥时提前结束，避免发布客户端无法安装的更新。
      - name: Prepare signed update
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "::error::请在仓库 Secrets 中配置 MYGO_UPDATER_PRIVATE_KEY"
            exit 1
          fi
          version=$(jq -er '.version' mygo.json)
          echo "version=v$version" >> "$GITHUB_ENV"
          # 更新弹窗读取版本章节，继续沿用 UPDATE.md 作为发行说明来源。
          printf '## %s\n\n' "$version" > CHANGELOG.md
          cat UPDATE.md >> CHANGELOG.md
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 12.23.0
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install NSIS
        run: brew install makensis
      - name: Build desktop packages
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run desktop:package
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.version }}
          body_path: UPDATE.md
          tag_name: ${{ env.version }}
          append_body: false
          token: ${{ secrets.GITHUB_TOKEN }}
          # Linux 和 macOS 使用同一份 install.sh，发布时只取 Linux 产物中的副本。
          files: |
            ./build/**/*.deb
            ./build/**/*.rpm
            ./build/**/*.dmg
            ./build/**/*-setup-*.exe
            ./build/**/*.tar.gz
            ./build/**/update-*.json
            ./build/linux-amd64/install.sh
            ./build/**/install.ps1
            ./build/**/SHA256SUMS
